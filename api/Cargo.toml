[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lib]
name = "api"
path = "src/lib.rs"

[dependencies]
tracing = "0.1.41"
axum = { version = "0.8.4", features = ["json"]}
sea-orm = "1.1.12"
services = { path = "../services"}
entity = { path = "../entity"}
files-api = { path = "../files-api"}
reports = { path = "../reports"}
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"]}
serde = "1.0.219"