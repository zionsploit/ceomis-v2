[package]
name = "services"
version = "0.1.0"
edition = "2024"

[lib]
name = "services"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"]}
sea-orm = "1.1.12"
sha2 = "0.10.9"
tracing = "0.1.41"
hex = "0.4.3"
redis = { version = "0.31.0", features = ["tokio-native-tls-comp"]}
ts-rs = "10.1.0"
aws-sdk-s3 = { version = "1.94.0", features = ["behavior-version-latest"]}
tokio = { version = "1.45.1", features = ["full"]}
serde_json = "1.0.140"
chrono = "0.4.41"
